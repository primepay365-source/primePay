spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:primepay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Local Docker Oracle only: create the development Platform Admin login. Keep false in shared environments.
app.dev.bootstrap.enabled=${DEV_BOOTSTRAP_ENABLED:false}
app.dev.bootstrap.username=${DEV_ADMIN_USERNAME:admin@primepay.local}
app.dev.bootstrap.password=${DEV_ADMIN_PASSWORD:}
