# DEV ONLY - in-memory H2 in Oracle compatibility mode so the API starts without Docker.
# Oracle remains the database of record: use SPRING_PROFILES_ACTIVE=oracle for real Oracle.
spring.datasource.url=jdbc:h2:mem:primepay-${random.uuid};MODE=Oracle;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Random JWT secret per process when JWT_SECRET_BASE64 is not set (tokens die on restart).
app.security.jwt.allow-ephemeral-dev-secret=true
app.onboarding.otp.dev-mode=true

# Development Platform Admin login. Leave DEV_ADMIN_PASSWORD empty to generate a random one each start (printed once in the log).
app.dev.bootstrap.enabled=true
app.dev.bootstrap.username=${DEV_ADMIN_USERNAME:admin@primepay.local}
app.dev.bootstrap.password=${DEV_ADMIN_PASSWORD:}
# Password for the seeded role accounts (super@, master@, distributor@, retailer@primepay.local). Empty = generated per start.
app.dev.seed.password=${DEV_SEED_PASSWORD:}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
