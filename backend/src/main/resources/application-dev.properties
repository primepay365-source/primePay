# DEV ONLY: local development against your Oracle Database (FREEPDB1). Never use this profile for real users.

# A random JWT secret per process is allowed when JWT_SECRET_BASE64 is not set (tokens die on restart).
app.security.jwt.allow-ephemeral-dev-secret=true

# Simulated providers (payment gateway OTP, onboarding OTP, forgot-password code) may show their code on screen.
app.onboarding.otp.dev-mode=true

# Sign-in OTP: a channel with no provider configured writes the code to the server log instead of failing.
app.otp.log-delivery-allowed=true

# Development Platform Admin and demo accounts. Empty password = generated per start and printed once in the log.
app.dev.bootstrap.enabled=true
app.dev.bootstrap.username=${DEV_ADMIN_USERNAME:admin@primepay.local}
app.dev.bootstrap.password=${APP_DEV_BOOTSTRAP_PASSWORD:${DEV_ADMIN_PASSWORD:}}
app.dev.seed.password=${APP_DEV_SEED_PASSWORD:${DEV_SEED_PASSWORD:}}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
