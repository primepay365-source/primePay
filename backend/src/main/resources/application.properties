spring.application.name=primepay-api
server.port=${SERVER_PORT:8080}
# dev = local development (seed accounts, OTP written to the log when no provider is set). prod = real deployments.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local secrets: environment variables win; otherwise the git-ignored .env file (project root or backend folder).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------- Oracle Database (the only database)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=primepay-oracle
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.oracle.jdbc.implicitStatementCacheSize=50

# Schema is owned by Liquibase (ordered XML change sets); Hibernate only validates it.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ---------------------------------------------------------------- Security
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.field-key-base64=${FIELD_ENCRYPTION_KEY_BASE64:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.business-timezone=Asia/Kolkata

# ---------------------------------------------------------------- Sign-in one-time codes (OTP)
# Sign-in is two steps: email or mobile + password, then a code sent to that email (SMTP) or mobile (MSG91).
app.otp.length=6
app.otp.ttl=PT5M
app.otp.max-attempts=5
app.otp.resend-interval=PT60S
app.otp.max-resends=3
# Sign-in attempts that reach the code step, per account per 15 minutes.
app.otp.max-sign-ins-per-15-min=5
app.otp.mobile-country-code=91

# Email through any SMTP server (Gmail, Outlook, Zoho, SES SMTP, ...). Empty MAIL_HOST = email OTP not configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.otp.email.from=${MAIL_FROM:}
# Link put in the welcome email sent to new users (their role, username and password).
app.web.sign-in-url=${APP_SIGN_IN_URL:http://localhost:5173/login}

# SMS through MSG91 (DLT-approved OTP template with an ##otp## variable). Empty auth key = SMS OTP not configured.
app.otp.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.otp.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.otp.sms.msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com}

# Only for local development: write the code to the server log when a channel has no provider.
app.otp.log-delivery-allowed=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Only health is exposed; details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Request ID in every log line.
# Logging: console + rolling files in logs/ (see logback-spring.xml). Override the folder with LOG_DIR.
logging.file.path=${LOG_DIR:logs}
server.error.include-message=never
server.error.include-stacktrace=never
