spring.application.name=primepay-api
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Schema is owned by Liquibase; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.enabled=true

app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.business-timezone=Asia/Kolkata

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Mail (notifications). Development uses no real SMTP; providers are connected in a later phase.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Only health is exposed; details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# No mail server until a notification provider is connected; do not let that mark the API as down.
management.health.mail.enabled=false

# Request ID in every log line.
logging.pattern.level=%5p [%X{requestId:-}]
server.error.include-message=never
server.error.include-stacktrace=never
