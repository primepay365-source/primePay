# Production: every secret and provider must be configured; nothing is generated or shown on screen.
app.security.jwt.allow-ephemeral-dev-secret=false
app.onboarding.otp.dev-mode=false
app.otp.log-delivery-allowed=false
app.dev.bootstrap.enabled=false
app.dev.seed.sample-data=false

# Behind a load balancer / proxy: trust X-Forwarded-* for the public https origin.
server.forward-headers-strategy=framework
management.health.mail.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
