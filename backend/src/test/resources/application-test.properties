# Automated tests run against Oracle Database in their own schema (PRIMEPAY_TEST), rebuilt from the Liquibase
# change sets at the start of every test context. Credentials come from the git-ignored .env file.
spring.datasource.username=${TEST_DATASOURCE_USERNAME}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD}
spring.liquibase.drop-first=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Codes are captured by the test-only CapturingOtpSender; nothing is written to the log.
app.otp.log-delivery-allowed=false

# Tests sign the same accounts in many times; the per-account limit is tested separately.
app.otp.max-sign-ins-per-15-min=1000

# Emails go to support/CapturingMailSender (no real SMTP server).
spring.mail.host=smtp.test.invalid
app.otp.email.from=noreply@primepay.test
