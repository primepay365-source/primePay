# Local development stack: Oracle Free + PrimePay API + web.
#   cp .env.example .env    (then fill in the secrets)
#   docker compose up --build
# Oracle first start takes a few minutes while the database is created.
name: primepay

services:
  oracle:
    image: gvenzl/oracle-free:23.6-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?set ORACLE_SYS_PASSWORD in .env}
      APP_USER: ${ORACLE_APP_USER:-primepay}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?set ORACLE_APP_PASSWORD in .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build: ./backend
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${ORACLE_APP_USER:-primepay}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_APP_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?set JWT_SECRET_BASE64 in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      DEV_BOOTSTRAP_ENABLED: ${DEV_BOOTSTRAP_ENABLED:-true}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-admin@primepay.local}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  oracle-data:
