# Render Blueprint: one free web service running the API and the web app from the root Dockerfile.
# Needs an Oracle Database reachable from Render (Render does not host Oracle): fill in the SPRING_DATASOURCE_*
# values in the dashboard. Simulated payment providers, no real money. Passwords and the JWT secret are generated
# by Render and shown in the service's Environment tab.
services:
  - type: web
    name: primepay
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      # Oracle Database (entered in the Render dashboard; never committed)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FIELD_ENCRYPTION_KEY_BASE64
        sync: false
      # Platform Admin (admin@primepay.local)
      - key: APP_DEV_BOOTSTRAP_PASSWORD
        generateValue: true
      # Every other demo account (admin2@, super@, master@, distributor@, retailer@, retailer2@ primepay.local)
      - key: APP_DEV_SEED_PASSWORD
        generateValue: true
      # Keeps sign-ins valid across restarts of the same instance
      - key: JWT_SECRET_BASE64
        generateValue: true
