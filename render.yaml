# Render Blueprint: one free web service running the API and the web app from the root Dockerfile.
# Demo deployment: in-memory development database (resets on every restart), simulated payment providers,
# no real money. Passwords and the JWT secret are generated by Render and shown in the service's Environment tab.
services:
  - type: web
    name: primepay
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      # Platform Admin (admin@primepay.local)
      - key: APP_DEV_BOOTSTRAP_PASSWORD
        generateValue: true
      # Every other demo account (admin2@, super@, master@, distributor@, retailer@, retailer2@ primepay.local)
      - key: APP_DEV_SEED_PASSWORD
        generateValue: true
      # Keeps sign-ins valid across restarts of the same instance
      - key: JWT_SECRET_BASE64
        generateValue: true
